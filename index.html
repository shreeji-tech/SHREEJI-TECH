<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Ji | Jan Sewa & Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a; 
            color: #f1f5f9;
            padding-bottom: 70px; 
        }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
        
        .glass-header { 
            background: linear-gradient(135deg, rgba(185, 28, 28, 0.95), rgba(30, 58, 138, 0.95));
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .product-card { 
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }
        .product-card:hover { 
            transform: translateY(-8px);
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .category-btn {
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .active-cat {
            background: linear-gradient(to right, #ef4444, #3b82f6);
            color: white !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .ticker-wrapper { overflow: hidden; background: #ef4444; color: white; }
        .ticker-content { display: inline-block; white-space: nowrap; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="admin-bar" class="admin-only bg-red-600 text-white py-2 px-4 sticky top-0 z-[70]">
        <div class="container mx-auto flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
            <span><i class="fas fa-user-shield mr-2"></i> Admin Mode</span>
            <div class="flex space-x-3">
                <button onclick="openAdminModal()" class="bg-blue-600 px-2 py-1 rounded">Add Item</button>
                <button onclick="openOrderManager()" class="bg-white text-red-600 px-2 py-1 rounded">Orders</button>
                <button onclick="logout()" class="text-white">Exit</button>
            </div>
        </div>
    </div>

    <div class="ticker-wrapper py-1.5">
        <div class="ticker-content text-[10px] font-bold uppercase tracking-widest">
            Suniye! Humare yahan naye Refurbished Laptops ka stock aa gaya hai • Aadhar aur PAN card ki suvidha • Best Repairing
        </div>
    </div>

    <div id="adminPanel">
        <header class="sticky top-0 z-50 glass-header">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
                    <img src="https://raw.githubusercontent.com/shreeji-tech/SHREEJI-TECH/main/logo.jpg" class="w-10 h-10 rounded-lg border border-white/20 shadow-lg">
                    <div>
                        <h1 class="text-xl font-black text-white leading-none">SHREE JI</h1>
                        <p class="text-[8px] font-bold text-red-200 tracking-widest uppercase">Digital Hub</p>
                    </div>
                </div>
                <div class="relative cursor-pointer" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag text-xl text-white"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-white text-red-600 text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
                </div>
            </div>
        </header>

        <nav class="bg-slate-900 border-b border-white/5 sticky top-[60px] z-40 overflow-x-auto no-scrollbar">
            <div class="container mx-auto px-4 flex space-x-3 py-3 text-[11px] font-bold uppercase">
                <button onclick="filterCat('All')" class="category-btn active-cat">All</button>
                <button onclick="filterCat('Jan Sewa')" class="category-btn">Jan Sewa</button>
                <button onclick="filterCat('Mobiles')" class="category-btn">Mobiles</button>
                <button onclick="filterCat('Laptops')" class="category-btn">Laptops</button>
                <button onclick="filterCat('Repairing')" class="category-btn">Repairing</button>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-8">
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </main>
    </div>

    <div id="orderManager" class="hidden container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-white italic">Orders</h2>
            <button onclick="closeOrderManager()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold text-xs">Close</button>
        </div>
        <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-slate-900 border-l border-white/10 translate-x-full transition-transform duration-500 z-[110] flex flex-col">
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <h2 class="text-xl font-black text-white italic">My Cart</h2>
            <button onclick="toggleCart()"><i class="fas fa-times text-white"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-6 border-t border-white/10 bg-slate-800">
            <div class="flex justify-between text-lg font-black mb-4"><span>Total:</span><span id="cart-total" class="text-red-500">₹0</span></div>
            <button onclick="checkoutOrder()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black">ORDER VIA WHATSAPP</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-white/5 flex justify-around items-center py-3 md:hidden z-[60]">
        <button onclick="location.reload()" class="flex flex-col items-center text-red-500"><i class="fas fa-home"></i><span class="text-[9px] mt-1 font-bold">Home</span></button>
        <button onclick="toggleCart()" class="flex flex-col items-center text-gray-500"><i class="fas fa-shopping-bag"></i><span class="text-[9px] mt-1 font-bold">Cart</span></button>
        <button onclick="window.open('https://wa.me/917052055713')" class="flex flex-col items-center text-gray-500"><i class="fab fa-whatsapp"></i><span class="text-[9px] mt-1 font-bold">Chat</span></button>
        <button onclick="checkAdminAccess()" class="flex flex-col items-center text-gray-800"><i class="fas fa-fingerprint"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
            authDomain: "shree-4c33e.firebaseapp.com",
            projectId: "shree-4c33e",
            storageBucket: "shree-4c33e.firebasestorage.app",
            messagingSenderId: "759128544690",
            appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const WHATSAPP = "917052055713";

        let products = []; let cart = []; let orders = []; let currentFilter = 'All';

        db.collection("products").onSnapshot(snap => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            displayProducts();
        });

        function displayProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            let data = products.filter(p => currentFilter === 'All' || p.category === currentFilter);
            data.forEach(p => {
                grid.innerHTML += `
                <div class="product-card p-3 rounded-2xl relative">
                    <img src="${p.image}" class="w-full h-32 object-contain mb-3 rounded-lg bg-white/5">
                    <h4 class="font-bold text-white truncate text-xs">${p.name}</h4>
                    <div class="flex items-center justify-between mt-3">
                        <span class="text-sm font-black text-red-400">₹${p.price}</span>
                        <button onclick="addToCart('${p.id}')" class="bg-red-600 text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-plus"></i></button>
                    </div>
                </div>`;
            });
        }

        function addToCart(id) {
            const item = products.find(x => x.id === id);
            cart.push(item);
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                // NaN Fix: Ensure price is a clean number
                let priceValue = String(item.price).replace(/[^\d]/g, ''); 
                total += parseInt(priceValue || 0);

                container.innerHTML += `<div class="flex items-center space-x-3 bg-slate-800 p-3 rounded-xl border border-white/5">
                    <img src="${item.image}" class="w-10 h-10 object-cover rounded">
                    <div class="flex-1 text-xs"><h5>${item.name}</h5><p class="text-red-400">₹${item.price}</p></div>
                    <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('translate-x-full'); }
        function checkAdminAccess() {
            let p = prompt("Suniye, Secret Key?");
            if(p === "ShreeJi2121") { document.body.classList.add('is-admin'); }
        }
        function openOrderManager() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('orderManager').classList.remove('hidden');
        }
        function closeOrderManager() {
            document.getElementById('orderManager').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        }
        function filterCat(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('active-cat');
                if(b.innerText === cat) b.classList.add('active-cat');
            });
            displayProducts();
        }
    </script>
</body>
</html>
