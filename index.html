
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shree Ji E-Commerce</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#ff6f00;color:#fff;padding:15px;display:flex;justify-content:space-between}
button{padding:6px 10px;margin:3px;cursor:pointer}
.container{padding:15px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card,.box{background:#fff;padding:10px;border-radius:5px}
.card img{width:100%;height:150px;object-fit:cover}
.cart{position:fixed;top:0;right:-100%;width:340px;height:100%;background:#fff;padding:15px;transition:.3s;overflow:auto}
.cart.open{right:0}
input{width:100%;padding:7px;margin:4px 0}
.small{font-size:12px;color:gray}
footer{background:#222;color:#fff;text-align:center;padding:10px}
</style>
</head>

<body>

<header>
<div class="logo-area">
<img src="1000007701.jpg">
<div>
<h2>🛍️ Shree Ji E-Commerce</h2>
<div>
<button onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
<button onclick="logout()">Logout</button>
</div>
</header>

<div class="container">

<!-- ADMIN LOGIN -->
<div id="loginBox" class="box">
<h3>Admin Login</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="box" style="display:none">
<h3>Admin Panel</h3>

<label>Contact Number</label>
<input id="contact">
<button onclick="saveContact()">Save</button>
<p class="small">Current: <b id="showContact"></b></p>

<button onclick="toggleCOD()">Toggle COD</button>
<p class="small">COD: <b id="codStatus"></b></p>

<h4>Change Password</h4>
<input id="newPass" placeholder="New Password">
<button onclick="changePass()">Update</button>

<h4>Add Product</h4>
<input id="pname" placeholder="Name">
<input id="pprice" placeholder="Price">
<input id="pimg" placeholder="Image URL">
<input id="pstock" placeholder="Stock">
<button onclick="addProduct()">Add</button>

<h4>Orders</h4>
<div id="orders"></div>
</div>

<input id="search" placeholder="Search products..." onkeyup="renderProducts()">

<h3>Products</h3>
<div class="products" id="products"></div>

</div>

<!-- CART -->
<div class="cart" id="cart">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<h4>Total ₹<span id="total">0</span></h4>

<div class="box">
<input id="bname" placeholder="Name">
<input id="bphone" placeholder="Phone">
<input id="baddress" placeholder="Address">

<label><input type="radio" name="pay" value="upi" checked> UPI</label>
<label><input type="radio" name="pay" value="cod"> COD</label>
<p class="small">UPI ID: <b>dr.deepak2121-2@oksbi</b></p>
</div>

<button onclick="checkout()">Checkout</button>
<button onclick="toggleCart()">Close</button>
</div>

<footer>
© 2026 Shree Ji E-Commerce | Contact: <span id="footerContact"></span>
</footer>

<script>
/* ADMIN */
let admin={u:"admin",p:localStorage.getItem("ap")||"12345"};
let isAdmin=localStorage.getItem("ia");

/* DATA */
let products=JSON.parse(localStorage.getItem("pr"))||[];
let cart=JSON.parse(localStorage.getItem("ca"))||[];
let orders=JSON.parse(localStorage.getItem("or"))||[];
let COD=JSON.parse(localStorage.getItem("cod")); if(COD==null)COD=true;
let contact=localStorage.getItem("ct")||"7052055713";

/* SAVE */
function save(){
localStorage.setItem("pr",JSON.stringify(products));
localStorage.setItem("ca",JSON.stringify(cart));
localStorage.setItem("or",JSON.stringify(orders));
localStorage.setItem("cod",JSON.stringify(COD));
localStorage.setItem("ct",contact);
}

/* LOGIN */
function login(){
if(user.value==admin.u&&pass.value==admin.p){
localStorage.setItem("ia",1);location.reload();
}else alert("Wrong login");
}
function logout(){localStorage.removeItem("ia");location.reload();}

if(isAdmin){loginBox.style.display="none";adminPanel.style.display="block";}

/* ADMIN ACTIONS */
function saveContact(){contact=contactInput.value;save();renderContact();}
function toggleCOD(){COD=!COD;save();renderCOD();}
function changePass(){localStorage.setItem("ap",newPass.value);alert("Updated");}

/* PRODUCTS */
function addProduct(){
products.push({id:Date.now(),n:pname.value,p:+pprice.value,i:pimg.value,s:+pstock.value});
save();renderProducts();
}
function renderProducts(){
let q=search.value.toLowerCase();
productsDiv.innerHTML=products.filter(x=>x.n.toLowerCase().includes(q)).map(p=>`
<div class="card">
<img src="${p.i}">
<h4>${p.n}</h4>
₹${p.p}<br>Stock: ${p.s}
<button onclick="addToCart(${p.id})">Add</button>
</div>`).join("");
}

/* CART */
function addToCart(id){
let p=products.find(x=>x.id==id);
if(p.s<=0)return alert("Out of stock");
cart.push(p);p.s--;save();renderCart();renderProducts();
}
function renderCart(){
let t=0;
cartItems.innerHTML=cart.map((c,i)=>{t+=c.p;return `${c.n} ₹${c.p} <button onclick="cart.splice(${i},1);save();renderCart()">❌</button>`}).join("<br>");
total.innerText=t;cartCount.innerText=cart.length;
}
function toggleCart(){cartBox.classList.toggle("open");}

/* CHECKOUT */
function checkout(){
if(!bname.value||!bphone.value||!baddress.value)return alert("Fill details");
let m=document.querySelector('[name=pay]:checked').value;
if(m=="cod"&&!COD)return alert("COD disabled");
if(m=="upi")alert("Pay to UPI ID:\n dr.deepak2121-2@oksbi");

let o={
id:Date.now(),items:cart,total:cart.reduce((s,i)=>s+i.p,0),
buyer:{n:bname.value,p:bphone.value,a:baddress.value},
pay:m,status:"Pending"
};
orders.push(o);cart=[];save();renderCart();renderOrders();
window.open(`https://wa.me/91${contact}?text=`+encodeURIComponent(JSON.stringify(o,null,2)));
alert("Order placed");
}

/* ORDERS */
function renderOrders(){
if(!isAdmin)return;
ordersDiv.innerHTML=orders.map(o=>`
<div class="box">
<b>#${o.id}</b><br>
${o.buyer.n} (${o.buyer.p})<br>
${o.buyer.a}<br>
₹${o.total} | ${o.pay}<br>
Status: ${o.status}<br>
<button onclick="o.status='Shipped';save();renderOrders()">🚚</button>
<button onclick="o.status='Delivered';save();renderOrders()">✅</button>
<button onclick="o.status='Cancelled';save();renderOrders()">❌</button>
</div>`).join("");
}

/* HELPERS */
function renderCOD(){codStatus.innerText=COD?"ON":"OFF";}
function renderContact(){showContact.innerText=contact;footerContact.innerText=contact;}
const productsDiv=document.getElementById("products");
const cartItems=document.getElementById("cartItems");
const cartBox=document.getElementById("cart");
const ordersDiv=document.getElementById("orders");
const contactInput=document.getElementById("contact");

renderProducts();renderCart();renderOrders();renderCOD();renderContact();
</script>

</body>
</html>
