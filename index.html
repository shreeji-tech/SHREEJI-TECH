<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShreeJi Tech</title>

<style>
:root{
--purple:#6a11cb;
--pink:#2575fc;
--grad:linear-gradient(135deg,#6a11cb,#2575fc);
}

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(45deg,#0f0c29,#302b63,#24243e);
color:white;
padding-bottom:100px;
}

header{
background:#1a1a2e;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:15px;
}

.card{
background:rgba(255,255,255,0.06);
padding:10px;
border-radius:15px;
text-align:center;
}

.card img{
height:100px;
width:100%;
object-fit:contain;
background:white;
border-radius:10px;
}

.price{
color:#00f2fe;
font-weight:bold;
}

button{
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.cat-btn{
background:var(--grad);
color:white;
width:100%;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.box{
background:#1a1a2e;
padding:20px;
border-radius:15px;
width:90%;
max-width:400px;
}

input,select{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid #333;
background:#0f0c29;
color:white;
}

</style>
</head>

<body>

<header>
<h3>SHREEJI TECH</h3>
<div onclick="openCheckout()">🛒 <span id="cartCount">0</span></div>
</header>

<input type="text" id="searchBox" placeholder="Search..." oninput="search()" style="width:95%;margin:10px;padding:10px;border-radius:20px;border:none;">

<div class="grid" id="productGrid"></div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminModal">
<div class="box">
<h3>Admin Panel</h3>
<input type="hidden" id="editKey">
<input type="text" id="pName" placeholder="Product Name">
<input type="number" id="pPrice" placeholder="Price">
<input type="text" id="pImg" placeholder="Image URL">
<select id="pCat">
<option>Mobile Accessories</option>
<option>Laptop Accessories</option>
<option>Refurbished Mobile</option>
<option>Refurbished Laptop</option>
</select>
<button onclick="save()">Save</button>
<button onclick="closeModal()">Close</button>
</div>
</div>

<!-- CHECKOUT -->
<div class="modal" id="checkoutModal">
<div class="box">
<h3>Final Bill</h3>
<div id="billItems"></div>
<h2 id="totalAmount"></h2>
<button onclick="confirmOrder()">Order via WhatsApp</button>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script type="module">

//////////////////////////////
// 🔥 FIREBASE MODULAR SETUP
//////////////////////////////

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
authDomain: "shree-4c33e.firebaseapp.com",
databaseURL: "https://shree-4c33e-default-rtdb.firebaseio.com",
projectId: "shree-4c33e",
storageBucket: "shree-4c33e.firebasestorage.app",
messagingSenderId: "759128544690",
appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const productsRef = ref(database, "products");

//////////////////////////////
// VARIABLES
//////////////////////////////

let allProducts=[];
let cart=[];

//////////////////////////////
// LOAD PRODUCTS
//////////////////////////////

onValue(productsRef,(snapshot)=>{
const data=snapshot.val();
allProducts=data?Object.keys(data).map(k=>({id:k,...data[k]})):[];
render(allProducts);
});

//////////////////////////////
// RENDER
//////////////////////////////

window.render=(items)=>{
const grid=document.getElementById("productGrid");
grid.innerHTML=items.map(p=>`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
<div>${p.name}</div>
<div class="price">₹${p.price}</div>
<button class="cat-btn" onclick="addToCart('${p.name}',${p.price})">Add To Cart</button>
<button onclick="editProduct('${p.id}')">Edit</button>
<button onclick="deleteProduct('${p.id}')">Delete</button>
</div>
`).join('');
}

//////////////////////////////
// SEARCH
//////////////////////////////

window.search=()=>{
let q=document.getElementById("searchBox").value.toLowerCase();
render(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
}

//////////////////////////////
// ADD PRODUCT
//////////////////////////////

window.save=()=>{
let name=pName.value;
let price=pPrice.value;
let img=pImg.value;
let cat=pCat.value;
let key=editKey.value;

if(!name||!price||!img)return alert("Fill all fields");

let obj={name,price:parseInt(price),img,cat};

if(key) update(ref(database,"products/"+key),obj);
else push(productsRef,obj);

closeModal();
}

window.deleteProduct=(id)=>{
if(confirm("Delete?")) remove(ref(database,"products/"+id));
}

window.editProduct=(id)=>{
let p=allProducts.find(x=>x.id===id);
pName.value=p.name;
pPrice.value=p.price;
pImg.value=p.img;
pCat.value=p.cat;
editKey.value=id;
adminModal.style.display="flex";
}

//////////////////////////////
// CART
//////////////////////////////

window.addToCart=(n,p)=>{
cart.push({n,p});
cartCount.innerText=cart.length;
}

window.openCheckout=()=>{
if(cart.length==0)return alert("Cart empty");
let total=cart.reduce((s,i)=>s+i.p,0);
billItems.innerHTML=cart.map(i=>`${i.n} - ₹${i.p}`).join("<br>");
totalAmount.innerText="Total: ₹"+total;
checkoutModal.style.display="flex";
}

window.confirmOrder=()=>{
let total=cart.reduce((s,i)=>s+i.p,0);
let msg=`*ShreeJi Tech Order*%0A${cart.map(i=>"- "+i.n).join("%0A")}%0A*Total: ₹${total}*`;
window.open(`https://wa.me/917052055713?text=${msg}`);
}

window.closeModal=()=>{
adminModal.style.display="none";
checkoutModal.style.display="none";
editKey.value="";
}

</script>

</body>
</html>
