<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShreeJi Tech | Admin Store</title>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root { --grad: linear-gradient(135deg, #6a11cb, #2575fc); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f0c29; color: white; padding-bottom: 100px; overflow-x: hidden; }
        
        header { background: #1a1a2e; padding: 15px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        
        .cat-bar { display: flex; overflow-x: auto; padding: 10px; gap: 8px; scrollbar-width: none; background: #1a1a2e; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #333; color: white; padding: 8px 15px; border-radius: 20px; border: none; white-space: nowrap; cursor: pointer; }
        .active { background: #6a11cb; font-weight: bold; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { background: rgba(255, 255, 255, 0.06); padding: 10px; border-radius: 15px; text-align: center; position: relative; border: 1px solid #333; }
        .card img { height: 110px; width: 100%; object-fit: contain; border-radius: 10px; background: white; margin-bottom: 8px; }
        .price { color: #00f2fe; font-weight: bold; font-size: 1.1em; }
        
        button { cursor: pointer; border: none; transition: 0.3s; }
        .add-btn { background: var(--grad); color: white; width: 100%; padding: 10px; border-radius: 10px; margin-top: 8px; font-weight: bold; }
        
        .admin-btn { position: absolute; top: 5px; padding: 5px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; color: white; }
        .edit-btn { right: 45px; background: orange; }
        .del-btn { right: 5px; background: red; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .box { background: #1a1a2e; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; border: 1px solid #444; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f0c29; color: white; border: 1px solid #444; border-radius: 10px; box-sizing: border-box; }
        .save-btn { background: #00c851; color: white; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        
        .order-box { background: #111; padding: 12px; margin-bottom: 10px; border-radius: 10px; font-size: 13px; border-left: 4px solid #6a11cb; }
    </style>
</head>
<body>

<header>
    <h3 style="margin:0;">SHREEJI TECH</h3>
    <div style="font-size: 20px; display:flex; gap:15px;">
        <span onclick="openOrders()">📋</span>
        <span onclick="openCheckout()">🛒 <small id="cartCount" style="background:red;border-radius:50%;padding:2px 6px;font-size:10px;">0</small></span>
        <span onclick="adminLogin()">⚙️</span>
    </div>
</header>

<input type="text" id="searchInput" placeholder="Laptop, Mobile search karein..." oninput="search(this.value)" style="width:92%; margin:15px auto; display:block; padding:12px; border-radius:25px; border:none; background:#1a1a2e; color:white; outline:none;">

<div class="cat-bar">
    <button class="cat-btn active" onclick="filterCat('All',this)">All Items</button>
    <button class="cat-btn" onclick="filterCat('Laptop Accessories',this)">Laptop</button>
    <button class="cat-btn" onclick="filterCat('Mobile Accessories',this)">Mobile</button>
    <button class="cat-btn" onclick="filterCat('Refurbished Mobile',this)">Used Phone</button>
    <button class="cat-btn" onclick="filterCat('Refurbished Laptop',this)">Used Laptop</button>
    <button class="cat-btn" onclick="filterCat('Jan Sewa',this)">Jan Sewa</button>
</div>

<div class="grid" id="productGrid"></div>

<div class="modal" id="adminModal">
    <div class="box">
        <h3 id="modalTitle">Add Product</h3>
        <input type="hidden" id="editKey">
        <input id="pName" placeholder="Item Name">
        <input id="pPrice" type="number" placeholder="Price (₹)">
        <input id="pImg" placeholder="GitHub File Name (e.g. mouse.jpg)">
        <select id="pCat">
            <option>Laptop Accessories</option>
            <option>Mobile Accessories</option>
            <option>Refurbished Mobile</option>
            <option>Refurbished Laptop</option>
            <option>Jan Sewa</option>
        </select>
        <button class="save-btn" onclick="saveProduct()">SAVE TO STORE</button>
        <button onclick="closeModal()" style="width:100%; background:none; color:gray; margin-top:10px;">Cancel</button>
    </div>
</div>

<div class="modal" id="cartModal">
    <div class="box">
        <h3>🛒 Your Cart</h3>
        <div id="cartItems" style="margin:15px 0; border-top:1px solid #333; padding-top:10px;"></div>
        <h3 id="total" style="color:#00f2fe">Total: ₹0</h3>
        <button class="save-btn" style="background:#25d366" onclick="placeOrder()">PLACE ORDER (WhatsApp)</button>
        <button onclick="closeModal()" style="width:100%; background:none; color:gray; margin-top:10px;">Close</button>
    </div>
</div>

<div class="modal" id="ordersModal">
    <div class="box">
        <h3>📦 Store Orders</h3>
        <div id="ordersList"></div>
        <button onclick="closeModal()" style="width:100%; background:var(--grad); color:white; padding:10px; border-radius:10px; margin-top:10px;">Back</button>
    </div>
</div>

<script>
// --- CONFIGURATION ---
const firebaseConfig = {
    apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
    authDomain: "shree-4c33e.firebaseapp.com",
    databaseURL: "https://shree-4c33e-default-rtdb.firebaseio.com",
    projectId: "shree-4c33e",
    storageBucket: "shree-4c33e.firebasestorage.app",
    messagingSenderId: "759128544690",
    appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
};

// Yahan apna GitHub link daalein
const GITHUB_BASE = "https://raw.githubusercontent.com/DeepakSingh/ShreeJiTechImages/main/";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let products = [], cart = [], admin = false, currentCat = "All";

// --- DATA FETCH ---
db.ref("products").on("value", snap => {
    const data = snap.val();
    products = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
    render();
});

// --- RENDER FUNCTION (Fixed for Search & Filter) ---
function render(filteredItems) {
    let list = filteredItems || (currentCat === "All" ? products : products.filter(p => p.cat === currentCat));
    const grid = document.getElementById("productGrid");
    
    if(list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/3; text-align:center; color:gray;">No items found...</p>`;
        return;
    }

    grid.innerHTML = list.map(p => {
        let finalImg = p.img.includes("http") ? p.img : GITHUB_BASE + p.img;
        return `
        <div class="card">
            ${admin ? `
                <button class="admin-btn edit-btn" onclick="editProduct('${p.id}')">EDIT</button>
                <button class="admin-btn del-btn" onclick="deleteProduct('${p.id}')">DEL</button>
            ` : ''}
            <img src="${finalImg}" onerror="this.src='https://via.placeholder.com/150?text=ShreeJi+Tech'">
            <div style="font-size:14px; margin:5px 0; height:35px; overflow:hidden;">${p.name}</div>
            <div class="price">₹${p.price}</div>
            <button class="add-btn" onclick="addToCart('${p.name}',${p.price})">ADD TO CART</button>
        </div>`;
    }).join('');
}

// --- CORE FUNCTIONS ---
function filterCat(cat, btn) {
    currentCat = cat;
    document.getElementById("searchInput").value = "";
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function search(q) {
    let filtered = products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
    render(filtered);
}

function adminLogin() {
    let pass = prompt("Enter Password:");
    if(pass === "1234") { // Aap password badal sakte hain
        admin = !admin;
        alert(admin ? "Admin Mode ON" : "Admin Mode OFF");
        render();
    } else alert("Wrong Password");
}

function saveProduct() {
    let name = pName.value, price = pPrice.value, img = pImg.value, cat = pCat.value, key = editKey.value;
    if(!name || !price || !img) return alert("Please fill all details!");
    
    let obj = { name, price: parseInt(price), img, cat };
    if(key) db.ref("products/"+key).update(obj).then(() => closeModal());
    else db.ref("products").push(obj).then(() => closeModal());
}

function editProduct(id) {
    let p = products.find(x => x.id === id);
    pName.value = p.name;
    pPrice.value = p.price;
    pImg.value = p.img;
    pCat.value = p.cat;
    editKey.value = id;
    document.getElementById("modalTitle").innerText = "Edit Product";
    document.getElementById("adminModal").style.display = "flex";
}

function deleteProduct(id) {
    if(confirm("Confirm Delete?")) db.ref("products/"+id).remove();
}

// --- CART & ORDER ---
function addToCart(n, p) {
    cart.push({n, p});
    document.getElementById("cartCount").innerText = cart.length;
    if(navigator.vibrate) navigator.vibrate(50);
}

function openCheckout() {
    if(cart.length === 0) return alert("Cart is empty!");
    let totalAmt = cart.reduce((s,i) => s + i.p, 0);
    document.getElementById("cartItems").innerHTML = cart.map((i, index) => 
        `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>${i.n}</span> <b>₹${i.p}</b>
        </div>`
    ).join('');
    document.getElementById("total").innerText = "Total Payable: ₹" + totalAmt;
    document.getElementById("cartModal").style.display = "flex";
}

function placeOrder() {
    let totalAmt = cart.reduce((s,i) => s + i.p, 0);
    let order = { items: cart, total: totalAmt, time: new Date().toLocaleString() };
    db.ref("orders").push(order);
    
    let msg = `*NEW ORDER: ShreeJi Tech*%0A--------------------------%0A${cart.map(i => "✅ " + i.n + " - ₹" + i.p).join("%0A")}%0A--------------------------%0A*TOTAL: ₹${totalAmt}*`;
    window.open("https://wa.me/917052055713?text=" + msg);
    
    cart = [];
    document.getElementById("cartCount").innerText = 0;
    closeModal();
}

function openOrders() {
    if(!admin) return alert("Admin only!");
    db.ref("orders").once("value", snap => {
        let data = snap.val();
        document.getElementById("ordersList").innerHTML = data ? Object.values(data).reverse().map(o => `
            <div class="order-box">
                <b>Date:</b> ${o.time}<br>
                <b>Items:</b> ${o.items.map(i => i.n).join(", ")}<br>
                <b>Amount:</b> ₹${o.total}
            </div>`).join('') : "No Orders Found.";
    });
    document.getElementById("ordersModal").style.display = "flex";
}

function closeModal() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = "none");
    editKey.value = "";
    pName.value = ""; pPrice.value = ""; pImg.value = "";
    document.getElementById("modalTitle").innerText = "Add Product";
}
</script>

</body>
</html>
