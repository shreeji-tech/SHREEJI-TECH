<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Ji Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #fb923c; --dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 90px; color: #1e293b; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .premium-card { background: white; border-radius: 28px; transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .premium-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); }
        .royal-bg { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .accent-gradient { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); }
        
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="admin-bar" class="admin-only bg-gray-900 text-white py-2 px-4 sticky top-0 z-[70] shadow-xl">
        <div class="container mx-auto flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
            <span><i class="fas fa-user-shield mr-2 text-orange-500"></i> Admin Mode Activated</span>
            <div class="flex space-x-2">
                <button onclick="openAdminModal()" class="bg-orange-600 px-3 py-1 rounded-full">Add Item</button>
                <button onclick="openOrderManager()" class="bg-blue-600 px-3 py-1 rounded-full">Orders</button>
                <button onclick="logout()" class="text-red-400 ml-2">Exit</button>
            </div>
        </div>
    </div>

    <div id="adminPanel">
        <header class="sticky top-0 z-50 glass">
            <div class="container mx-auto px-5 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3" onclick="location.reload()">
                    <img src="https://raw.githubusercontent.com/shreeji-tech/SHREEJI-TECH/main/logo.jpg" class="w-10 h-10 rounded-xl shadow-md border-2 border-white">
                    <div>
                        <h1 class="text-lg font-800 tracking-tight text-gray-900 leading-none">SHREE JI</h1>
                        <span class="text-[8px] font-bold text-orange-500 uppercase tracking-widest">Digital Hub</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative cursor-pointer" onclick="toggleCart()">
                        <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100"><i class="fas fa-shopping-bag text-gray-600"></i></div>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                    </div>
                    <button onclick="checkAdminAccess()" class="text-gray-300"><i class="fas fa-fingerprint"></i></button>
                </div>
            </div>
        </header>

        <div class="px-5 mt-4">
            <div class="royal-bg rounded-[2rem] p-6 text-white relative overflow-hidden shadow-xl">
                <div class="relative z-10">
                    <h2 class="text-2xl font-800">Premium Laptops <br>& Services</h2>
                    <p class="text-[10px] opacity-70 mt-1 mb-4">Gorakhpur's Trusted Digital Store</p>
                    <button class="bg-orange-500 text-white px-6 py-2 rounded-xl font-bold text-xs">Explore Store</button>
                </div>
                <i class="fas fa-laptop absolute -right-6 -bottom-6 text-8xl text-white/10 rotate-12"></i>
            </div>
        </div>

        <div class="flex gap-3 overflow-x-auto px-5 py-6 no-scrollbar">
            <button onclick="filterCat('All')" class="bg-dark text-white px-6 py-2.5 rounded-full font-bold text-xs whitespace-nowrap shadow-md">All Items</button>
            <button onclick="filterCat('Jan Sewa')" class="bg-white text-gray-500 px-6 py-2.5 rounded-full font-bold text-xs whitespace-nowrap shadow-sm border">Jan Sewa</button>
            <button onclick="filterCat('Mobiles')" class="bg-white text-gray-500 px-6 py-2.5 rounded-full font-bold text-xs whitespace-nowrap shadow-sm border">Mobiles</button>
            <button onclick="filterCat('Laptops')" class="bg-white text-gray-500 px-6 py-2.5 rounded-full font-bold text-xs whitespace-nowrap shadow-sm border">Laptops</button>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 px-5 pb-10"></div>
    </div>

    <div id="orderManager" class="hidden container mx-auto px-5 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-800 text-gray-900">Manage Orders</h2>
            <button onclick="location.reload()" class="bg-gray-200 px-4 py-2 rounded-xl text-xs font-bold">Back</button>
        </div>
        <div id="orders-list" class="space-y-4"></div>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-lg p-6 glass">
            <h2 class="text-xl font-800 mb-4" id="modal-heading">Add New Product</h2>
            <form id="product-form" class="space-y-3">
                <input type="hidden" id="edit-id">
                <input type="text" id="p-name" placeholder="Item Name" class="w-full bg-gray-50 p-4 rounded-xl outline-none border font-bold">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="p-price" placeholder="Price (₹)" class="bg-gray-50 p-4 rounded-xl outline-none font-bold">
                    <select id="p-cat" class="bg-gray-50 p-4 rounded-xl outline-none font-bold">
                        <option value="Jan Sewa">Jan Sewa</option>
                        <option value="Mobiles">Mobiles</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <textarea id="p-desc" placeholder="Details..." class="w-full bg-gray-50 p-4 rounded-xl h-20 font-medium"></textarea>
                <input type="file" id="p-image-file" class="hidden" onchange="previewImage(this)">
                <label for="p-image-file" class="block border-2 border-dashed p-4 rounded-xl text-center cursor-pointer text-gray-400 text-xs font-bold">CLICK TO UPLOAD IMAGE</label>
                <button type="button" onclick="handleSave()" id="save-btn" class="w-full accent-gradient text-white py-4 rounded-xl font-800 uppercase shadow-lg">Save Product</button>
                <button type="button" onclick="closeAdminModal()" class="w-full text-gray-400 text-[10px] font-bold mt-2">CANCEL</button>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-6 left-5 right-5 h-20 glass rounded-[2.5rem] flex items-center justify-around px-6 shadow-2xl border-white/50 z-[60]">
        <button onclick="location.reload()" class="text-orange-500 flex flex-col items-center gap-1">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[8px] font-bold uppercase">Home</span>
        </button>
        <button onclick="openTracker()" class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-truck text-lg"></i>
            <span class="text-[8px] font-bold uppercase">Track</span>
        </button>
        <button onclick="toggleCart()" class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span class="text-[8px] font-bold uppercase">Cart</span>
        </button>
        <button onclick="window.open('https://wa.me/917052055713')" class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fab fa-whatsapp text-lg"></i>
            <span class="text-[8px] font-bold uppercase">Chat</span>
        </button>
    </nav>

    <script>
        // Firebase Configuration (Same as yours)
        const firebaseConfig = {
            apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
            authDomain: "shree-4c33e.firebaseapp.com",
            projectId: "shree-4c33e",
            storageBucket: "shree-4c33e.firebasestorage.app",
            messagingSenderId: "759128544690",
            appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [];
        let cart = [];
        let currentFilter = 'All';

        // Initialize Admin Mode
        if(sessionStorage.getItem('isAdmin')) document.body.classList.add('is-admin');

        // Realtime Fetch
        db.collection("products").onSnapshot(snap => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const data = products.filter(p => currentFilter === 'All' || p.category === currentFilter);
            grid.innerHTML = data.map(p => `
                <div class="premium-card p-3 relative flex flex-col">
                    <div class="admin-only absolute top-2 right-2 flex gap-1 z-10">
                        <button onclick="editItem('${p.id}')" class="bg-blue-500 text-white w-6 h-6 rounded-lg text-[10px]"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteItem('${p.id}')" class="bg-red-500 text-white w-6 h-6 rounded-lg text-[10px]"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="h-32 mb-3 rounded-2xl overflow-hidden bg-gray-50 flex items-center justify-center">
                        <img src="${p.image}" class="w-full h-full object-contain">
                    </div>
                    <h4 class="font-bold text-gray-800 text-xs truncate">${p.name}</h4>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="text-sm font-800">₹${p.price}</span>
                        <button onclick="addToCart('${p.id}')" class="w-8 h-8 accent-gradient text-white rounded-xl flex items-center justify-center shadow-md active:scale-90 transition">
                            <i class="fas fa-plus text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Functions for Admin Controls
        window.openOrderManager = function() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('orderManager').classList.remove('hidden');
            displayOrders();
        }

        function displayOrders() {
            const list = document.getElementById('orders-list');
            db.collection("orders").orderBy("createdAt", "desc").get().then(snap => {
                list.innerHTML = snap.docs.map(doc => {
                    const o = doc.data();
                    return `<div class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-start">
                            <h4 class="font-800 text-orange-600 text-sm">ID: ${o.orderId || 'NEW'}</h4>
                            <span class="bg-orange-50 text-orange-500 text-[9px] font-bold px-2 py-1 rounded-full">${o.status || 'Pending'}</span>
                        </div>
                        <p class="text-xs font-bold text-gray-700 mt-2">${o.name} | ${o.phone}</p>
                        <p class="text-[10px] text-gray-400">${o.address}</p>
                        <div class="mt-3 pt-3 border-t border-dashed flex justify-between items-center">
                            <span class="text-sm font-800">₹${o.total}</span>
                            <button onclick="window.open('https://wa.me/${o.phone}')" class="text-green-500 text-sm"><i class="fab fa-whatsapp"></i></button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        function filterCat(cat) { currentFilter = cat; renderProducts(); }
        function toggleCart() { alert("Cart coming soon in full version!"); }
        function addToCart(id) { cart.push(products.find(p => p.id === id)); document.getElementById('cart-count').innerText = cart.length; }
        
        function checkAdminAccess() {
            const p = prompt("Enter Admin Key:");
            if(p === "ShreeJi2121") {
                sessionStorage.setItem('isAdmin', 'true');
                document.body.classList.add('is-admin');
                alert("Radhe Radhe! Admin Mode On.");
            }
        }
        function logout() { sessionStorage.removeItem('isAdmin'); location.reload(); }
        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
    </script>
</body>
</html>
