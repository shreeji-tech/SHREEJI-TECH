<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Ji | Jan Sewa & Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding-bottom: 70px; }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s ease; }
        .ticker-wrapper { overflow: hidden; background: #fff7ed; border-bottom: 1px solid #ffedd5; }
        .ticker-content { display: inline-block; white-space: nowrap; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body class="text-gray-900">

    <div id="admin-bar" class="admin-only bg-red-600 text-white py-2 px-4 sticky top-0 z-[70]">
        <div class="container mx-auto flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
            <span><i class="fas fa-user-shield mr-2"></i> ADMIN MODE ACTIVE</span>
            <div class="flex space-x-3">
                <button onclick="openAdminModal()" class="bg-black/20 px-2 py-1 rounded">Add Item</button>
                <button onclick="logoutAdmin()" class="underline">Logout</button>
            </div>
        </div>
    </div>

    <div class="ticker-wrapper py-1.5">
        <div class="ticker-content text-[10px] font-bold text-orange-600 uppercase tracking-widest">
            Suniye! Refurbished Laptops ka naya stock aa gaya hai • Aadhaar aur PAN card suvidha • Best Mobile Repairing in Gorakhpur
        </div>
    </div>

    <header class="bg-white sticky top-0 z-50 glass border-b border-orange-100">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
                <img src="https://raw.githubusercontent.com/shreeji-tech/SHREEJI-TECH/main/logo.jpg" class="w-[45px] h-[45px] rounded-lg shadow-sm border">
                <div>
                    <h1 class="text-xl font-black tracking-tighter text-gray-800 leading-none">SHREE JI</h1>
                    <p class="text-[8px] font-bold text-orange-600 tracking-widest uppercase">Digital & Jan Sewa</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div id="cart-trigger" class="relative cursor-pointer" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag text-xl text-gray-700"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-600 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
                </div>
                <button onclick="checkAdminAccess()" class="text-gray-300 p-1"><i class="fas fa-fingerprint"></i></button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </main>

    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl translate-x-full transition-transform duration-500 z-[100] flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-xl font-black">My Cart</h2>
            <button onclick="toggleCart()" class="text-xl">×</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-6 border-t">
            <div class="flex justify-between text-lg font-black mb-4">
                <span>Total:</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <button onclick="checkoutOrder()" class="w-full bg-gray-900 text-white py-4 rounded-xl font-black">CHECKOUT WHATSAPP</button>
        </div>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6">
            <h2 id="modal-heading" class="text-xl font-black mb-4">Add Item</h2>
            <form id="product-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="text" id="p-name" placeholder="Item Name" class="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none">
                <input type="number" id="p-price" placeholder="Price" class="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none">
                <select id="p-cat" class="w-full bg-gray-50 p-4 rounded-xl font-bold outline-none">
                    <option value="Jan Sewa">Jan Sewa</option>
                    <option value="Mobiles">Mobiles</option>
                    <option value="Laptops">Laptops</option>
                </select>
                <input type="file" id="p-image-file" class="w-full">
                <button type="button" onclick="handleSave()" id="save-btn" class="w-full bg-orange-600 text-white py-4 rounded-xl font-black">SAVE ITEM</button>
            </form>
            <button onclick="closeAdminModal()" class="w-full mt-2 text-gray-400">Cancel</button>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
            authDomain: "shree-4c33e.firebaseapp.com",
            projectId: "shree-4c33e",
            storageBucket: "shree-4c33e.firebasestorage.app",
            messagingSenderId: "759128544690",
            appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = []; let cart = [];

        // Real-time listener
        db.collection("products").onSnapshot(snap => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const isAdmin = sessionStorage.getItem('isAdmin') === 'true';
            grid.innerHTML = '';

            products.forEach(p => {
                grid.innerHTML += `
                <div class="product-card bg-white p-3 rounded-2xl border shadow-sm relative">
                    <div class="admin-only absolute top-2 right-2 flex space-x-1 z-10">
                        <button onclick="editItem('${p.id}')" class="bg-blue-600 text-white p-1 rounded shadow"><i class="fas fa-pen text-[10px]"></i></button>
                        <button onclick="deleteItem('${p.id}')" class="bg-red-600 text-white p-1 rounded shadow"><i class="fas fa-trash text-[10px]"></i></button>
                    </div>
                    <img src="${p.image}" class="w-full h-32 object-contain mb-2">
                    <h4 class="font-bold text-sm truncate">${p.name}</h4>
                    <div class="flex justify-between items-center mt-2">
                        <span class="font-black text-gray-800">₹${p.price}</span>
                        ${!isAdmin ? `
                        <button onclick="addToCart('${p.id}')" class="bg-black text-white p-2 rounded-lg">
                            <i class="fas fa-plus"></i>
                        </button>` : ''}
                    </div>
                </div>`;
            });
        }

        // Calculation Fix (No more NaN)
        function addToCart(id) {
            const item = products.find(x => x.id === id);
            cart.push(item);
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            
            cart.forEach((item, idx) => {
                const cleanPrice = String(item.price).replace(/[^0-9.]/g, '');
                total += Number(cleanPrice) || 0;
                
                container.innerHTML += `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-10 h-10 object-cover rounded">
                        <div><p class="text-xs font-bold">${item.name}</p><p class="text-orange-600 font-bold">₹${item.price}</p></div>
                    </div>
                    <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500 font-bold">×</button>
                </div>`;
            });
            document.getElementById('cart-total').innerText = "₹" + total;
        }

        // Admin Auth
        function checkAdminAccess() {
            const key = prompt("Enter Admin Key:");
            if(key === "ShreeJi2121") {
                sessionStorage.setItem('isAdmin', 'true');
                document.body.classList.add('is-admin');
                renderProducts(); // Refresh buttons
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdmin');
            document.body.classList.remove('is-admin');
            renderProducts();
            alert("Admin Logged Out");
        }

        // Init Admin state
        if(sessionStorage.getItem('isAdmin') === 'true') document.body.classList.add('is-admin');

        // Functions
        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('translate-x-full'); }
        function openAdminModal() { 
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-heading').innerText = "Add New Item";
            document.getElementById('admin-modal').classList.remove('hidden'); 
        }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        async function handleSave() {
            const file = document.getElementById('p-image-file').files[0];
            const editId = document.getElementById('edit-id').value;
            let imgUrl = editId ? products.find(p => p.id == editId).image : "https://via.placeholder.com/150";

            if(file) {
                const fd = new FormData(); fd.append('image', file);
                const res = await fetch('https://api.imgbb.com/1/upload?key=893d6b612e41b4f52cd9626cf9cc21ee', { method: 'POST', body: fd });
                const d = await res.json(); imgUrl = d.data.url;
            }

            const data = {
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                category: document.getElementById('p-cat').value,
                image: imgUrl
            };

            if(editId) await db.collection("products").doc(editId).update(data);
            else await db.collection("products").add(data);
            closeAdminModal();
        }

        function editItem(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-cat').value = p.category;
            document.getElementById('modal-heading').innerText = "Edit Item";
            openAdminModal();
        }

        async function deleteItem(id) { if(confirm("Delete this item?")) await db.collection("products").doc(id).delete(); }

        function checkoutOrder() {
            if(cart.length === 0) return alert("Cart is empty!");
            const name = prompt("Aapka Naam?");
            let itemsList = cart.map(i => `- ${i.name} (₹${i.price})`).join('%0A');
            const msg = `*NEW ORDER FROM SHREE JI*%0A%0A*Name:* ${name}%0A*Items:*%0A${itemsList}%0A%0A*Total:* ${document.getElementById('cart-total').innerText}`;
            window.open(`https://wa.me/917052055713?text=${msg}`);
        }
    </script>
</body>
</html>
