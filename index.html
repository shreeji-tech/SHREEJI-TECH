<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Ji | Jan Sewa & Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 70px; /* Space for Mobile Nav */
        }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.96); }
        .loader { border-top-color: #ea580c; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Smooth Scroll */
        html { scroll-behavior: smooth; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }

        .brand-logo { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-900">

    <div id="admin-bar" class="admin-only bg-gray-900 text-white py-2 px-4 sticky top-0 z-[70]">
        <div class="container mx-auto flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
            <span><i class="fas fa-user-shield mr-2"></i> Admin Mode</span>
            <div class="flex space-x-3">
                <button onclick="openAdminModal()" class="bg-orange-600 px-2 py-1 rounded">Add Item</button>
                <button onclick="openOrderManager()" class="bg-blue-600 px-2 py-1 rounded">Orders</button>
                <button onclick="logout()" class="text-red-400">Exit</button>
            </div>
        </div>
    </div>

    <header class="bg-white sticky top-0 z-50 glass border-b border-orange-100">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
                <img src="logo.jpg" alt="Logo" class="brand-logo shadow-sm border border-orange-50">
                <div>
                    <h1 class="text-xl font-black tracking-tighter text-gray-800 leading-none">SHREE JI</h1>
                    <p class="text-[8px] font-bold text-orange-600 tracking-widest uppercase">Digital & Jan Sewa</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="startVoice()" class="text-gray-500 hover:text-orange-600 p-2"><i class="fas fa-microphone text-lg"></i></button>
                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <i class="fas fa-shopping-bag text-xl text-gray-700"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-600 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
                </div>
                <button onclick="checkAdminAccess()" class="text-gray-300 p-1"><i class="fas fa-fingerprint"></i></button>
            </div>
        </div>
        
        <div class="px-4 pb-3">
            <div class="relative">
                <input type="text" id="ai-input-mobile" onkeyup="if(event.key==='Enter') askAI(this.value)" placeholder="Search services or gadgets..." 
                       class="w-full bg-gray-100 border-none p-3 rounded-xl outline-none text-sm pl-10">
                <i class="fas fa-search absolute left-3 top-3.5 text-gray-400 text-sm"></i>
            </div>
        </div>
    </header>

    <section class="container mx-auto px-4 my-4">
        <div class="bg-gradient-to-br from-orange-600 to-orange-500 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-xl font-black">Shree Ji Official App</h2>
                <p class="text-xs opacity-90 mb-4">Behtar experience ke liye app install karein.</p>
                <a href="app-release.apk" download class="inline-flex items-center bg-white text-orange-600 px-5 py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95 transition">
                    <i class="fab fa-android mr-2 text-lg"></i> Download APK
                </a>
            </div>
            <i class="fab fa-android absolute -right-4 -bottom-4 text-8xl opacity-10 rotate-12"></i>
        </div>
    </section>

    <nav class="bg-white border-b border-gray-100 sticky top-[70px] md:top-[80px] z-40 overflow-x-auto no-scrollbar">
        <div class="container mx-auto px-4 flex space-x-6 py-3 text-[11px] font-bold text-gray-500 whitespace-nowrap uppercase tracking-wider">
            <button onclick="filterCat('All')" class="category-btn text-orange-600 border-b-2 border-orange-600 pb-1">All</button>
            <button onclick="filterCat('Jan Sewa')" class="category-btn hover:text-orange-600">Jan Sewa</button>
            <button onclick="filterCat('Mobiles')" class="category-btn hover:text-orange-600">Mobiles</button>
            <button onclick="filterCat('Laptops')" class="category-btn hover:text-orange-600">Laptops</button>
            <button onclick="filterCat('Accessories')" class="category-btn hover:text-orange-600">Repairing</button>
        </div>
    </nav>

    <section class="container mx-auto px-4 mt-6">
        <div class="bg-gray-900 rounded-3xl p-8 text-white flex items-center justify-between shadow-xl relative overflow-hidden">
            <div class="z-10">
                <span class="text-orange-500 text-[10px] font-bold tracking-[0.3em] uppercase">Premium Tech Hub</span>
                <h2 class="text-3xl font-black mt-2 leading-tight">Fastest Digital <br>Services.</h2>
                <button onclick="scrollToProducts()" class="mt-6 bg-orange-600 text-white px-6 py-3 rounded-xl font-bold text-sm">Shop Now</button>
            </div>
            <div class="opacity-30"><i class="fas fa-bolt fa-6x text-orange-500"></i></div>
        </div>
    </section>

    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-end mb-6">
            <h3 id="category-title" class="text-xl font-black text-gray-800">Featured Products</h3>
            <select onchange="sortByPrice(this.value)" class="text-[10px] font-bold bg-white border-none rounded-lg p-2 outline-none shadow-sm">
                <option value="none">SORT BY</option>
                <option value="low">Low Price</option>
                <option value="high">High Price</option>
            </select>
        </div>
        <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8"></div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-100 flex justify-around items-center py-3 md:hidden z-[60] shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        <button onclick="location.reload()" class="flex flex-col items-center text-orange-600">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] font-bold mt-1">Home</span>
        </button>
        <button onclick="openTracker()" class="flex flex-col items-center text-gray-400">
            <i class="fas fa-truck-fast text-lg"></i>
            <span class="text-[10px] font-bold mt-1">Track</span>
        </button>
        <button onclick="toggleCart()" class="flex flex-col items-center text-gray-400">
            <i class="fas fa-shopping-bag text-lg"></i>
            <span class="text-[10px] font-bold mt-1">Cart</span>
        </button>
        <button onclick="window.open('https://wa.me/917052055713')" class="flex flex-col items-center text-gray-400">
            <i class="fab fa-whatsapp text-lg"></i>
            <span class="text-[10px] font-bold mt-1">Chat</span>
        </button>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black" id="modal-heading">Add New Item</h2>
                <button onclick="closeAdminModal()" class="text-gray-400"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="product-form" class="space-y-4 text-sm">
                <input type="hidden" id="edit-id">
                <input type="text" id="p-name" placeholder="Product Name" class="w-full bg-gray-50 p-4 rounded-2xl outline-none focus:ring-2 ring-orange-500 font-bold">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-price" placeholder="Price (₹)" class="bg-gray-50 p-4 rounded-2xl outline-none font-bold">
                    <select id="p-cat" class="bg-gray-50 p-4 rounded-2xl outline-none font-bold">
                        <option value="Jan Sewa">Jan Sewa</option>
                        <option value="Mobiles">Mobiles</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <textarea id="p-desc" placeholder="Details..." class="w-full bg-gray-50 p-4 rounded-2xl outline-none font-medium h-24"></textarea>
                <div class="border-2 border-dashed border-gray-100 p-8 rounded-2xl text-center">
                    <input type="file" id="p-image-file" class="hidden" accept="image/*" onchange="previewImage(this)">
                    <label for="p-image-file" class="cursor-pointer block">
                        <i class="fas fa-image text-3xl text-orange-300 mb-2"></i>
                        <p id="file-name" class="text-[10px] font-bold text-gray-400">TAP TO UPLOAD IMAGE</p>
                    </label>
                </div>
                <button type="button" onclick="handleSave()" id="save-btn" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition">Save Product</button>
            </form>
        </div>
    </div>

    <div id="order-manager-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-4xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 text-xl font-black">
                <h2>Manage Orders</h2>
                <button onclick="closeOrderManager()"><i class="fas fa-times text-gray-400"></i></button>
            </div>
            <div id="order-list-body" class="space-y-4"></div>
        </div>
    </div>

    <div id="track-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl">
            <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-location-crosshairs text-2xl text-blue-600"></i>
            </div>
            <h3 class="text-xl font-black mb-4">Track Your Order</h3>
            <input type="tel" id="track-phone" placeholder="Enter Phone or Order ID" class="w-full bg-gray-50 p-4 rounded-2xl text-center font-bold text-lg mb-4 outline-none border-2 border-transparent focus:border-blue-500">
            <button onclick="processTrack()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">Track Now</button>
            <div id="track-result" class="mt-4 p-4 rounded-2xl hidden font-bold text-sm"></div>
            <button onclick="closeTracker()" class="mt-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Close</button>
        </div>
    </div>

    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-3xl translate-x-full transition-transform duration-500 z-[100] flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-xl font-black italic">My Cart</h2>
            <button onclick="toggleCart()" class="text-xl text-gray-400"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-6 border-t bg-white">
            <div class="flex justify-between text-lg font-black mb-4">
                <span>Total:</span>
                <span id="cart-total" class="text-orange-600">₹0</span>
            </div>
            <button onclick="checkoutOrder()" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black active:scale-95 transition">CHECKOUT VIA WHATSAPP</button>
        </div>
    </div>

    <script>
        // Logics Preserved & Optimized
        const ADMIN_PASS = "ShreeJi2121";
        const WHATSAPP = "917052055713";
        const IMGBB_KEY = "893d6b612e41b4f52cd9626cf9cc21ee";

        let products = JSON.parse(localStorage.getItem('sji_products')) || [];
        let cart = [];
        let orders = JSON.parse(localStorage.getItem('sji_orders')) || [];
        let currentFilter = 'All';

        const knowledge = {
            "laptop": "Refurbished Laptops ₹10,000 se start hain. HP, Dell, Lenovo available.",
            "mobile": "iPhone, Samsung, aur OnePlus ke best models stock mein hain.",
            "aadhar": "Aadhar download, PVC card aur corrections ki service available hai.",
            "pan": "Naya PAN card 3 din mein ban jayega.",
            "repair": "Mobile/Laptop motherboard repairing fast service ke saath.",
            "warranty": "Har gadget par 6 mahine ki shop warranty milti hai."
        };

        function checkAdminAccess() {
            let p = prompt("Enter Secret Key:");
            if(p === ADMIN_PASS) {
                sessionStorage.setItem('isAdmin', 'true');
                document.body.classList.add('is-admin');
                alert("Radhe Radhe!");
            }
        }

        function logout() {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        }

        function displayProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            let filtered = products.filter(p => currentFilter === 'All' || p.category === currentFilter);
            
            if(!filtered.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400 font-bold">No items in ${currentFilter}.</div>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                <div class="product-card bg-white p-3 md:p-5 rounded-3xl shadow-sm border border-orange-50 relative">
                    <div class="admin-only absolute top-2 right-2 flex space-x-1 z-10">
                        <button onclick="editItem(${p.id})" class="bg-blue-500 text-white w-7 h-7 rounded-lg text-[10px]"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteItem(${p.id})" class="bg-red-500 text-white w-7 h-7 rounded-lg text-[10px]"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="h-32 md:h-48 bg-gray-50 rounded-2xl mb-3 flex items-center justify-center overflow-hidden">
                        <img src="${p.image}" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[8px] font-black uppercase text-orange-500 bg-orange-50 px-2 py-1 rounded-md">${p.category}</span>
                    <h4 class="font-black text-gray-800 mt-2 truncate text-sm md:text-base">${p.name}</h4>
                    <div class="flex items-center justify-between mt-3">
                        <span class="text-base md:text-lg font-black text-gray-900">₹${p.price.toLocaleString()}</span>
                        <button onclick="addToCart(${p.id})" class="bg-gray-900 text-white w-8 h-8 rounded-xl flex items-center justify-center hover:bg-orange-600 transition">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>`;
            });
        }

        async function handleSave() {
            const name = document.getElementById('p-name').value;
            const price = parseInt(document.getElementById('p-price').value);
            const cat = document.getElementById('p-cat').value;
            const desc = document.getElementById('p-desc').value;
            const file = document.getElementById('p-image-file').files[0];
            const editId = document.getElementById('edit-id').value;

            if(!name || !price) return alert("Details bhariye!");

            const btn = document.getElementById('save-btn');
            btn.innerHTML = `<i class="fas fa-spinner loader"></i> Saving...`;
            btn.disabled = true;

            let imgUrl = editId ? products.find(p => p.id == editId).image : "https://via.placeholder.com/300";

            if(file) {
                const fd = new FormData();
                fd.append('image', file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
                    const data = await res.json();
                    imgUrl = data.data.url;
                } catch(e) { console.error("Upload failed"); }
            }

            const item = { id: editId ? parseInt(editId) : Date.now(), name, price, category: cat, desc, image: imgUrl };
            if(editId) products = products.map(p => p.id == editId ? item : p);
            else products.push(item);

            localStorage.setItem('sji_products', JSON.stringify(products));
            location.reload();
        }

        function deleteItem(id) {
            if(confirm("Delete karein?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('sji_products', JSON.stringify(products));
                displayProducts();
            }
        }

        function editItem(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('modal-heading').innerText = "Edit Item";
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-cat').value = p.category;
            document.getElementById('p-desc').value = p.desc;
            openAdminModal();
        }

        function addToCart(id) {
            cart.push(products.find(x => x.id === id));
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                container.innerHTML += `
                <div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                    <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg">
                    <div class="flex-1 text-xs font-bold">
                        <h5 class="truncate w-32">${item.name}</h5>
                        <p class="text-orange-600">₹${item.price}</p>
                    </div>
                    <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-400 p-2"><i class="fas fa-trash"></i></button>
                </div>`;
            });
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function checkoutOrder() {
            if(!cart.length) return alert("Cart khali hai!");
            const name = prompt("Aapka Naam:");
            const phone = prompt("WhatsApp Number:");
            const address = prompt("Delivery Address:");
            if(!name || !phone || !address) return alert("Sabhi details zaroori hain!");

            const orderId = "SJI-" + Math.floor(1000 + Math.random() * 9000);
            const total = document.getElementById('cart-total').innerText;
            const newOrder = { id: orderId, name, phone, address, total, status: 'Processing', date: new Date().toLocaleDateString() };
            
            orders.push(newOrder);
            localStorage.setItem('sji_orders', JSON.stringify(orders));

            let itemsList = cart.map(item => `- ${item.name} (₹${item.price})`).join('%0A');
            const msg = `*Naya Order!*%0A%0A*ID:* ${orderId}%0A*Naam:* ${name}%0A*Pata:* ${address}%0A%0A*Items:*%0A${itemsList}%0A%0A*Total:* ${total}`;
            window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
            
            cart = []; updateCartUI(); toggleCart();
            alert("Order Submit! ID: " + orderId);
        }

        function openOrderManager() {
            const list = document.getElementById('order-list-body');
            list.innerHTML = '';
            orders.reverse().forEach((o) => {
                list.innerHTML += `
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-xs font-bold relative">
                    <span class="absolute top-4 right-4 bg-orange-100 text-orange-600 px-2 py-1 rounded">#${o.id}</span>
                    <p class="text-gray-800 text-sm mb-1">${o.name}</p>
                    <p class="text-gray-400 mb-2">${o.phone}</p>
                    <p class="text-orange-600 mb-3">${o.total}</p>
                    <div class="flex space-x-2">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="bg-white border p-2 rounded-lg outline-none">
                            <option value="">Status: ${o.status}</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <button onclick="deleteOrder('${o.id}')" class="text-red-500">Delete</button>
                    </div>
                </div>`;
            });
            document.getElementById('order-manager-modal').classList.remove('hidden');
        }

        function updateOrderStatus(id, status) {
            if(!status) return;
            orders = orders.map(o => o.id === id ? {...o, status} : o);
            localStorage.setItem('sji_orders', JSON.stringify(orders));
            openOrderManager();
        }

        function deleteOrder(id) {
            if(confirm("Order delete karein?")) {
                orders = orders.filter(o => o.id !== id);
                localStorage.setItem('sji_orders', JSON.stringify(orders));
                openOrderManager();
            }
        }

        function askAI(val) {
            const input = val ? val.toLowerCase() : prompt("Aap kya dhoond rahe hain?").toLowerCase();
            let res = "Humari services ki jankari ke liye WhatsApp karein.";
            for(let k in knowledge) if(input.includes(k)) res = knowledge[k];
            alert("Assistant: " + res);
        }

        function filterCat(cat) {
            currentFilter = cat;
            document.getElementById('category-title').innerText = cat === 'All' ? 'Featured Products' : cat;
            
            // UI Tab Update
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('text-orange-600', 'border-b-2', 'border-orange-600');
                if(btn.innerText.includes(cat)) btn.classList.add('text-orange-600', 'border-b-2', 'border-orange-600');
            });
            displayProducts();
        }

        function processTrack() {
            const phone = document.getElementById('track-phone').value;
            const o = orders.find(o => o.phone === phone || o.id === phone || o.id === "SJI-"+phone);
            const resDiv = document.getElementById('track-result');
            resDiv.classList.remove('hidden');
            if(o) {
                resDiv.className = "mt-4 p-4 rounded-2xl bg-green-50 text-green-700 block";
                resDiv.innerHTML = `Order #${o.id}<br>Status: ${o.status}<br><small>${o.date}</small>`;
            } else {
                resDiv.className = "mt-4 p-4 rounded-2xl bg-red-50 text-red-700 block";
                resDiv.innerHTML = "Detail nahi mili!";
            }
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('translate-x-full'); }
        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
        function openTracker() { document.getElementById('track-modal').classList.remove('hidden'); }
        function closeTracker() { document.getElementById('track-modal').classList.add('hidden'); }
        function closeOrderManager() { document.getElementById('order-manager-modal').classList.add('hidden'); }
        function previewImage(input) { if(input.files[0]) document.getElementById('file-name').innerText = input.files[0].name; }
        function scrollToProducts() { window.scrollTo({ top: 500, behavior: 'smooth' }); }

        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'hi-IN';
            rec.start();
            rec.onresult = (e) => { 
                const text = e.results[0][0].transcript;
                document.getElementById('ai-input-mobile').value = text;
                askAI(text);
            };
        }

        window.onload = () => {
            if(sessionStorage.getItem('isAdmin')) document.body.classList.add('is-admin');
            displayProducts();
        };
    </script>
</body>
</html>
