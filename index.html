<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Ji Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { --primary: #fb923c; --dark: #0f172a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 90px; }

        /* Glossy Card Design */
        .premium-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .premium-card:hover { transform: translateY(-8px); box-shadow: 0 20px 30px -10px rgba(251, 146, 60, 0.2); }

        /* Luxury Gradient */
        .royal-bg { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .accent-gradient { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); }

        /* Floating Animation for Cart Badge */
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
        .cart-pop { animation: pop 0.3s ease-out; }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: block !important; }
    </style>
</head>
<body>

    <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-gray-100">
        <div class="container mx-auto px-5 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/shreeji-tech/SHREEJI-TECH/main/logo.jpg" class="w-11 h-11 rounded-2xl shadow-lg border-2 border-white">
                <div>
                    <h1 class="text-xl font-800 tracking-tight text-gray-900 leading-none">SHREE JI</h1>
                    <span class="text-[9px] font-bold text-orange-500 uppercase tracking-[0.2em]">Digital Hub</span>
                </div>
            </div>
            <div class="flex items-center gap-5">
                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <div id="cart-icon-bg" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 group-hover:bg-orange-100 transition-colors">
                        <i class="fas fa-shopping-bag text-gray-700 group-hover:text-orange-600"></i>
                    </div>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </div>
                <button onclick="checkAdminAccess()" class="text-gray-300 hover:text-orange-500"><i class="fas fa-shield-halved"></i></button>
            </div>
        </div>
    </header>

    <div id="adminPanel">
        <div class="px-5 mt-6">
            <div class="royal-bg rounded-[2.5rem] p-8 relative overflow-hidden shadow-2xl">
                <div class="relative z-10">
                    <span class="bg-orange-500/20 text-orange-400 text-[10px] font-bold px-3 py-1 rounded-full uppercase mb-3 inline-block">Refurbished Stock</span>
                    <h2 class="text-3xl font-800 text-white leading-tight">Premium Laptops <br>& Services</h2>
                    <button class="mt-5 accent-gradient text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-orange-500/30">Explore Store</button>
                </div>
                <i class="fas fa-laptop absolute -right-10 -bottom-10 text-[12rem] text-white/5 rotate-12"></i>
            </div>
        </div>

        <div class="flex gap-4 overflow-x-auto px-5 py-6 no-scrollbar">
            <button onclick="filterCat('All')" class="cat-pill bg-dark text-white px-6 py-3 rounded-2xl font-bold text-xs whitespace-nowrap">All Items</button>
            <button onclick="filterCat('Jan Sewa')" class="cat-pill bg-white text-gray-500 px-6 py-3 rounded-2xl font-bold text-xs whitespace-nowrap shadow-sm border">Jan Sewa</button>
            <button onclick="filterCat('Mobiles')" class="cat-pill bg-white text-gray-500 px-6 py-3 rounded-2xl font-bold text-xs whitespace-nowrap shadow-sm border">Mobiles</button>
            <button onclick="filterCat('Laptops')" class="cat-pill bg-white text-gray-500 px-6 py-3 rounded-2xl font-bold text-xs whitespace-nowrap shadow-sm border">Laptops</button>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 px-5 pb-10">
            </div>
    </div>

    <nav class="fixed bottom-6 left-5 right-5 h-20 bg-dark/90 backdrop-blur-2xl rounded-[2.5rem] flex items-center justify-around px-6 shadow-2xl border border-white/10 z-[60]">
        <button onclick="location.reload()" class="text-orange-500 flex flex-col items-center gap-1">
            <i class="fas fa-grid-2 text-xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-widest">Home</span>
        </button>
        <button onclick="openTracker()" class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-map-location-dot text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Track</span>
        </button>
        <button onclick="window.open('https://wa.me/917052055713')" class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fab fa-whatsapp text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Help</span>
        </button>
    </nav>

    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-full max-w-sm bg-white z-[100] translate-x-full transition-transform duration-500 shadow-[-20px_0_50px_rgba(0,0,0,0.1)] flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h3 class="text-xl font-800">Your Basket</h3>
            <button onclick="toggleCart()" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center"><i class="fas fa-times text-gray-400"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-8 border-t bg-gray-50/50">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-500 font-bold">Total Amount</span>
                <span id="cart-total" class="text-2xl font-800 text-gray-900">₹0</span>
            </div>
            <button onclick="checkoutOrder()" class="w-full accent-gradient text-white py-5 rounded-[1.5rem] font-bold shadow-xl shadow-orange-500/20 active:scale-95 transition">Secure Checkout</button>
        </div>
    </div>

    <script>
        // --- Same Firebase Config as before ---
        const firebaseConfig = {
            apiKey: "AIzaSyBuCywyMgEw_j9yeHD-E4KwRWZGreWagTc",
            authDomain: "shree-4c33e.firebaseapp.com",
            projectId: "shree-4c33e",
            storageBucket: "shree-4c33e.firebasestorage.app",
            messagingSenderId: "759128544690",
            appId: "1:759128544690:web:3f57e7ed9117a1acdd80ab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let products = [];
        let cart = [];

        // Realtime Fetch
        db.collection("products").onSnapshot(snap => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="premium-card p-4 flex flex-col">
                    <div class="relative h-36 mb-4 rounded-3xl overflow-hidden bg-white">
                        <img src="${p.image}" class="w-full h-full object-contain">
                        <span class="absolute top-2 left-2 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-[8px] font-800 text-orange-600 uppercase border border-orange-100">${p.category}</span>
                    </div>
                    <h4 class="font-bold text-gray-800 text-sm truncate">${p.name}</h4>
                    <p class="text-[10px] text-gray-400 mt-1 line-clamp-1">${p.desc || 'Best quality service'}</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-lg font-800 text-gray-900">₹${p.price}</span>
                        <button onclick="addToCart('${p.id}')" class="w-10 h-10 accent-gradient text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- FIXED CART LOGIC ---
        function addToCart(id) {
            const item = products.find(x => x.id === id);
            cart.push(item);
            
            // Animation for Badge
            const badge = document.getElementById('cart-count');
            badge.innerText = cart.length;
            badge.classList.add('cart-pop');
            setTimeout(() => badge.classList.remove('cart-pop'), 300);

            // Icon Highlight
            const icon = document.getElementById('cart-icon-bg');
            icon.classList.replace('bg-gray-100', 'bg-orange-500');
            icon.querySelector('i').classList.replace('text-gray-700', 'text-white');
            setTimeout(() => {
                icon.classList.replace('bg-orange-500', 'bg-gray-100');
                icon.querySelector('i').classList.replace('text-white', 'text-gray-700');
            }, 800);

            updateCartUI();
            // toggleCart(); <-- Yeh line remove kar di hai taaki cart baar baar na khule
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            let total = 0;
            container.innerHTML = cart.map((it, idx) => {
                total += Number(it.price);
                return `
                <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-[1.5rem]">
                    <img src="${it.image}" class="w-12 h-12 rounded-xl object-cover bg-white">
                    <div class="flex-1">
                        <h5 class="text-xs font-bold text-gray-800">${it.name}</h5>
                        <p class="text-orange-600 font-bold text-xs">₹${it.price}</p>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="text-red-300 hover:text-red-500"><i class="fas fa-trash-can"></i></button>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('translate-x-full');
        }

        function checkAdminAccess() {
            const pass = prompt("Suniye, admin key batayiye:");
            if(pass === "ShreeJi2121") {
                document.body.classList.add('is-admin');
                alert("Welcome Boss!");
            }
        }
    </script>
</body>
</html>
